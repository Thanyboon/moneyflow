
<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6846e8">
  <meta name="description" content="MONEYFLOW แอปวางแผนการเงินส่วนบุคคล">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MONEYFLOW">

  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">

  <title>MONEYFLOW — วางแผนการเงิน</title>
</head>
<body>

<div class="app">

  <header class="topbar">
    <button class="brand" data-page="dashboard">
      <span class="logo">฿</span>
      <span>
        <b>MONEYFLOW</b>
        <small>จัดการเงินอย่างเข้าใจ</small>
      </span>
    </button>

    <div class="top-actions">
      <span id="syncState" class="sync">
        <i></i> ยังไม่เชื่อมต่อ
      </span>
      <button id="themeBtn" class="round" aria-label="เปลี่ยนธีม">◐</button>
    </div>
  </header>

  <div class="layout">

    <aside class="sidebar">
      <div class="side-label">เมนูหลัก</div>

      <button class="nav active" data-page="dashboard">▦ <span>ภาพรวม</span></button>
      <button class="nav" data-page="transactions">↕ <span>รายรับ-รายจ่าย</span></button>
      <button class="nav" data-page="wallets">▣ <span>บัญชี / กระเป๋าเงิน</span></button>
      <button class="nav" data-page="goals">◎ <span>เป้าหมายการออม</span></button>
      <button class="nav" data-page="budgets">▤ <span>งบประมาณ</span></button>
      <button class="nav" data-page="reconcile">⌁ <span>ตรวจสอบยอดธนาคาร</span></button>
      <button class="nav" data-page="bills">♧ <span>หารบิลกับเพื่อน</span></button>
      <button class="nav" data-page="reports">▥ <span>รายงาน</span></button>
      <button class="nav" data-page="settings">⚙ <span>ตั้งค่าและซิงค์</span></button>

      <div class="side-foot">
        MONEYFLOW
        <span>Personal Finance</span>
      </div>
    </aside>

    <main id="content" class="content" aria-live="polite">
      <p>กำลังโหลด MONEYFLOW...</p>
    </main>

  </div>

  <nav class="mobile-nav">
    <button class="active" data-page="dashboard"><b>▦</b>หน้าหลัก</button>
    <button data-page="transactions"><b>↕</b>รายการ</button>
    <button data-page="goals"><b>◎</b>ออมเงิน</button>
    <button data-page="bills"><b>♧</b>หารบิล</button>
    <button data-page="settings"><b>⚙</b>ตั้งค่า</button>
  </nav>

</div>

<div id="modalRoot"></div>
<div id="toast" class="toast" role="status"></div>

<script src="./app.js" defer></script>

</body>
</html>
