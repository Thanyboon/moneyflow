
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#059669" />
  <title>MoneyFlow</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f3f7f6;
      color: #12352b;
    }
    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 32px 20px;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 4px 20px #0000000a;
    }
    h1 { color: #059669; }
    button {
      background: #059669;
      color: white;
      border: 0;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main>
    <h1>💚 MoneyFlow</h1>
    <div class="card">
      <h2>ยินดีต้อนรับ</h2>
      <p>แอปวางแผนการเงินส่วนบุคคล</p>
      <p>โปรเจกต์ของคุณพร้อมเริ่มพัฒนาแล้ว</p>
      <button onclick="alert('MoneyFlow พร้อมแล้ว!')">
        ทดสอบแอป
      </button>
    </div>
  </main>
</body>
</html>
